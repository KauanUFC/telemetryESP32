services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "18830:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MQTT_BROKER=mqtt://mosquitto:1883
    depends_on:
      - mosquitto
    restart: unless-stopped