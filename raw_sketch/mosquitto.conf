listener 1883 0.0.0.0
allow_anonymous true

# --- Bridge para HiveMQ (cloud) ---
connection hivemq-cloud
address broker.hivemq.com:1883

# Telemetria: local → cloud (out)
topic esp32/+/telemetry out 2
topic esp32/+/status out 2

# Comandos: cloud → local (in)
topic esp32/+/cmd/led in 2

# Local continua funcionando se bridge cair
try_private true
cleansession false
notifications false
keepalive 60